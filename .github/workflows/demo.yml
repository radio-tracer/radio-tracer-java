name: Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-demo:
    name: Package & integration demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package all modules
        run: mvn -B -q package -DskipTests

      - name: Integration test (demo-app under agent)
        run: bash .github/scripts/integration-demo.sh
        env:
          REPORT: ${{ github.workspace }}/demo-report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-reachability-report
          path: demo-report.html
          if-no-files-found: warn
