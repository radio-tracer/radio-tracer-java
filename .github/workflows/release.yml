name: Release

# Tag-driven release: push v0.1.0 → test → demo integration → GitHub Release + agent JAR
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, integration test & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check tag matches pom version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "tag=$TAG pom=$POM_VERSION"
          if [[ "$TAG" != "$POM_VERSION" ]]; then
            echo "error: git tag v$TAG must match project.version $POM_VERSION" >&2
            exit 1
          fi

      - name: Unit tests (100% coverage gate)
        run: mvn -B -q test

      - name: Package all modules
        run: mvn -B -q package -DskipTests

      - name: Integration test (demo-app under agent)
        run: bash .github/scripts/integration-demo.sh
        env:
          REPORT: ${{ github.workspace }}/demo-report.html

      - name: Resolve agent JAR path
        id: artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(agent/target/radio-tracer-agent-*.jar)
          filtered=()
          for j in "${jars[@]}"; do
            [[ "$(basename "$j")" == original-* ]] && continue
            filtered+=("$j")
          done
          if [[ ${#filtered[@]} -ne 1 ]]; then
            echo "error: expected one agent jar, got: ${filtered[*]:-none}" >&2
            exit 1
          fi
          echo "jar=${filtered[0]}" >> "$GITHUB_OUTPUT"
          ls -la "${filtered[0]}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          JAR="${{ steps.artifact.outputs.jar }}"
          NOTES="$(mktemp)"
          {
            echo "## RadioTracer Java agent ${TAG}"
            echo
            echo "First public preview — dynamic reachability agent for known dependency vulnerabilities."
            echo
            echo "### Artifact"
            echo "- \`$(basename "$JAR")\` — shaded agent JAR (\`-javaagent\`)"
            echo
            echo "### Requirements"
            echo "- App JVM: **JDK 21+**"
            echo "- Watchlist: \`methods.json\` (see \`examples/\` or radio-tracer-cve-import)"
            echo
            echo "### Quick start"
            echo '```bash'
            echo "java -javaagent:$(basename "$JAR")=methods=methods.json,report=report.html -jar your-app.jar"
            echo '```'
            echo
            echo "### Verification"
            echo "This release was produced by CI after unit tests and a **demo-app integration run** (3 REACHABLE methods)."
            echo
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md) for details."
          } >"$NOTES"

          assets=("$JAR")
          if [[ -f demo-report.html ]]; then
            assets+=(demo-report.html)
          fi

          gh release create "$TAG" \
            --title "$TAG — first public preview" \
            --notes-file "$NOTES" \
            "${assets[@]}"
